name: Inspect supplier features

on:
  push:
    branches:
      - codex/ajustar-seletor-pedidos

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip-inspect-supplier]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract relevant code
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          lines = p.read_text(encoding='utf-8').splitlines()
          markers = [
              'function normalizeData',
              'const nav',
              'Clientes',
              'function Clients',
              'function Purchases',
              'function SaleSupplyPicker',
              'modal?.type === "purchase"',
              'modal?.type === "client"',
              'modal?.type === "supply"',
              'function CostEditor',
              'function save',
          ]
          out = []
          seen = set()
          for marker in markers:
              for i, line in enumerate(lines):
                  if marker in line:
                      start = max(0, i - 40)
                      end = min(len(lines), i + 180)
                      key = (start, end)
                      if key in seen:
                          continue
                      seen.add(key)
                      out.append(f'\n===== MARKER: {marker} @ line {i+1} =====\n')
                      for n in range(start, end):
                          out.append(f'{n+1:05d}: {lines[n]}\n')
                      break
          Path('.inspection-supplier.txt').write_text(''.join(out), encoding='utf-8')
          PY
      - name: Commit inspection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .inspection-supplier.txt
          git commit -m "Gera inspeção temporária de fornecedores [skip-inspect-supplier]"
          git push origin HEAD:codex/ajustar-seletor-pedidos
