name: Improve client history

on:
  push:
    branches:
      - codex/ajustar-seletor-pedidos

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Improve client history
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          app_path = Path("src/App.tsx")
          css_path = Path("src/index.css")
          app = app_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          pattern = r'''function History\(\{ id, d, close \}: \{ id: number; d: D; close: \(\) => void \}\) \{.*?\n\}\n(?=\s*$|\s*function )'''
          replacement = r'''function History({ id, d, close }: { id: number; d: D; close: () => void }) {
            const c = d.clients.find((client) => client.id === id);
            const [query, setQuery] = useState("");
            const [showFilters, setShowFilters] = useState(false);
            const [month, setMonth] = useState("");
            const [saleDay, setSaleDay] = useState("");
            const customerSales = d.sales
              .filter((sale) => sale.clientId === id)
              .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
            const completedSales = customerSales.filter(
              (sale) => sale.status !== "cancelled",
            );
            const filteredSales = customerSales.filter((sale) => {
              const perfumeText = sale.items
                .map((item) => {
                  const product = d.products.find(
                    (candidate) => candidate.id === item.productId,
                  );
                  return product
                    ? product.brand + " " + product.name
                    : sale.description || "";
                })
                .join(" ")
                .toLowerCase();
              return (
                perfumeText.includes(query.trim().toLowerCase()) &&
                (!month || sale.date.startsWith(month)) &&
                (!saleDay || sale.date === saleDay)
              );
            });
            const totalPurchased = completedSales.reduce(
              (sum, sale) => sum + (isNoCost(sale) ? 0 : Math.max(0, sale.total)),
              0,
            );
            const bottleCount = completedSales.reduce(
              (sum, sale) => sum + sale.items.length,
              0,
            );
            const lastPurchase = completedSales[0];
            const lastPurchaseDays = lastPurchase
              ? Math.max(
                  0,
                  Math.floor(
                    (new Date(today() + "T12:00:00").getTime() -
                      new Date(lastPurchase.date + "T12:00:00").getTime()) /
                      86400000,
                  ),
                )
              : null;
            return (
              <div className="overlay">
                <div className="history clientHistory">
                  <header className="clientHistoryHeader">
                    <div className="clientHistoryTitle">
                      <h2>{c?.name}</h2>
                      <span>
                        Cliente desde {c?.date ? dateBR(c.date) : "data não informada"}
                      </span>
                    </div>
                    <button onClick={close} aria-label="Fechar histórico">
                      <X />
                    </button>
                  </header>

                  <div className="clientHistoryContact">
                    <span>
                      <b>CEP:</b> {c?.cep || "Não informado"}
                    </span>
                    {c?.addresses.map((address, index) => (
                      <span key={index}>
                        <b>{address.label || "Endereço"}:</b> {address.value}
                      </span>
                    ))}
                  </div>

                  <div className="clientHistoryStats">
                    <div>
                      <span>Valor total comprado</span>
                      <b>{brl(totalPurchased)}</b>
                    </div>
                    <div>
                      <span>Frascos comprados</span>
                      <b>{bottleCount}</b>
                    </div>
                    <div>
                      <span>Pedidos realizados</span>
                      <b>{completedSales.length}</b>
                    </div>
                    <div>
                      <span>Última compra em</span>
                      <b>
                        {lastPurchaseDays === null
                          ? "Sem compras"
                          : lastPurchaseDays +
                            " " +
                            (lastPurchaseDays === 1 ? "dia" : "dias")}
                      </b>
                    </div>
                  </div>

                  <div className="clientHistorySales">
                    <div className="clientHistorySalesHead">
                      <div>
                        <h3>Histórico de compras</h3>
                        <p>
                          {month || saleDay
                            ? "Exibindo o período selecionado."
                            : "Histórico completo do cliente (lifetime)."}
                        </p>
                      </div>
                    </div>

                    <div className="clientHistoryToolbar">
                      <label className="clientHistorySearch">
                        <Search />
                        <input
                          value={query}
                          onChange={(event) => setQuery(event.target.value)}
                          placeholder="Pesquisar por perfume pedido"
                          aria-label="Pesquisar perfume no histórico do cliente"
                        />
                      </label>
                      <button
                        type="button"
                        className={
                          showFilters || month || saleDay
                            ? "historyFilterButton active"
                            : "historyFilterButton"
                        }
                        onClick={() => setShowFilters((visible) => !visible)}
                      >
                        <SlidersHorizontal />
                        Filtrar por data
                      </button>
                    </div>

                    {showFilters ? (
                      <div className="clientHistoryFilters">
                        <label>
                          <span>Mês</span>
                          <input
                            type="month"
                            value={month}
                            onChange={(event) => {
                              setMonth(event.target.value);
                              if (event.target.value) setSaleDay("");
                            }}
                          />
                        </label>
                        <label>
                          <span>Data específica</span>
                          <input
                            type="date"
                            value={saleDay}
                            onChange={(event) => {
                              setSaleDay(event.target.value);
                              if (event.target.value) setMonth("");
                            }}
                          />
                        </label>
                        <button
                          type="button"
                          onClick={() => {
                            setMonth("");
                            setSaleDay("");
                          }}
                        >
                          Limpar filtro
                        </button>
                      </div>
                    ) : null}

                    <div className="clientHistoryTable">
                      <table>
                        <thead>
                          <tr>
                            <th>Pedido</th>
                            <th>Data</th>
                            <th>Perfumes</th>
                            <th>Pagamento</th>
                            <th>Total</th>
                            <th>Status</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filteredSales.map((sale) => (
                            <tr
                              key={sale.id}
                              className={
                                sale.status === "cancelled" ? "cancelled" : ""
                              }
                            >
                              <td>#{orderNo(sale.id)}</td>
                              <td>{dateBR(sale.date)}</td>
                              <td>
                                {sale.items.length ? (
                                  sale.items.map((item, index) => {
                                    const product = d.products.find(
                                      (candidate) =>
                                        candidate.id === item.productId,
                                    );
                                    return (
                                      <small key={index}>
                                        {product
                                          ? product.brand + " " + product.name
                                          : "Perfume"}{" "}
                                        — {item.ml} ml
                                        {item.isApc ? " · APC" : ""}
                                      </small>
                                    );
                                  })
                                ) : (
                                  <small>
                                    {sale.description || "Venda antiga"}
                                  </small>
                                )}
                              </td>
                              <td>{sale.payment}</td>
                              <td>{brl(isNoCost(sale) ? 0 : sale.total)}</td>
                              <td>{saleBadge(sale)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      {!filteredSales.length ? (
                        <p className="empty">
                          Nenhuma compra encontrada com estes filtros.
                        </p>
                      ) : null}
                    </div>
                  </div>
                </div>
              </div>
            );
          }
          '''

          app, count = re.subn(pattern, replacement, app, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("History component not found")

          css += r'''

          /* Improved individual client history */
          .clientHistory {
            width: min(1100px, calc(100vw - 32px));
            max-height: calc(100vh - 30px);
            padding: 28px 30px;
            gap: 20px;
          }
          .clientHistoryHeader {
            align-items: flex-start;
          }
          .clientHistoryTitle {
            display: flex;
            align-items: baseline;
            gap: 14px;
            flex-wrap: wrap;
          }
          .clientHistoryTitle h2 {
            margin: 0;
          }
          .clientHistoryTitle span {
            color: #647185;
            font-size: 12px;
            font-weight: 800;
          }
          .clientHistoryContact {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            color: #445064;
            font-size: 13px;
          }
          .clientHistoryContact span {
            display: inline-flex;
            gap: 5px;
          }
          .clientHistoryStats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
          }
          .clientHistoryStats > div {
            border: 1px solid #d8dde5;
            border-radius: 13px;
            background: #fff;
            padding: 15px 16px;
            display: grid;
            gap: 7px;
          }
          .clientHistoryStats span {
            color: #647185;
            font-size: 11px;
            font-weight: 800;
          }
          .clientHistoryStats b {
            color: #172233;
            font-size: 20px;
          }
          .clientHistorySales {
            border: 1px solid #d8dde5;
            border-radius: 15px;
            background: #fff;
            padding: 20px;
            display: grid;
            gap: 15px;
            min-width: 0;
          }
          .clientHistorySalesHead h3 {
            margin: 0;
            color: #172233;
            font-size: 19px;
          }
          .clientHistorySalesHead p {
            margin: 5px 0 0;
            color: #647185;
            font-size: 12px;
          }
          .clientHistoryToolbar {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) auto;
            gap: 12px;
            align-items: center;
          }
          .clientHistorySearch {
            position: relative;
          }
          .clientHistorySearch svg {
            position: absolute;
            left: 13px;
            top: 13px;
            width: 18px;
            color: #7a8798;
          }
          .clientHistorySearch input {
            width: 100%;
            height: 44px;
            border: 1px solid #cfd5dd;
            border-radius: 10px;
            background: #fff;
            padding: 0 13px 0 40px;
            font: inherit;
          }
          .historyFilterButton,
          .clientHistoryFilters button {
            height: 44px;
            border: 1px solid #cfd5dd;
            border-radius: 10px;
            background: #fff;
            color: #172233;
            padding: 0 14px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
          }
          .historyFilterButton.active {
            border-color: #d5aa3d;
            background: #fff8e6;
            color: #8a6508;
          }
          .historyFilterButton svg {
            width: 16px;
          }
          .clientHistoryFilters {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            align-items: end;
            border-radius: 11px;
            background: #f4f1e9;
            padding: 12px;
          }
          .clientHistoryFilters label {
            display: grid;
            gap: 5px;
          }
          .clientHistoryFilters label span {
            color: #647185;
            font-size: 10px;
            font-weight: 800;
          }
          .clientHistoryFilters input {
            height: 40px;
            border: 1px solid #cfd5dd;
            border-radius: 9px;
            background: #fff;
            padding: 0 10px;
          }
          .clientHistoryTable {
            width: 100%;
            overflow: visible;
          }
          .clientHistoryTable table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
          }
          .clientHistoryTable th,
          .clientHistoryTable td {
            padding: 11px 9px;
            border-bottom: 1px solid #e0e4e9;
            text-align: left;
            vertical-align: top;
            white-space: normal;
            overflow-wrap: anywhere;
          }
          .clientHistoryTable th {
            color: #718096;
            font-size: 10px;
          }
          .clientHistoryTable td {
            color: #172233;
            font-size: 12px;
          }
          .clientHistoryTable th:nth-child(1) { width: 12%; }
          .clientHistoryTable th:nth-child(2) { width: 13%; }
          .clientHistoryTable th:nth-child(3) { width: 31%; }
          .clientHistoryTable th:nth-child(4) { width: 16%; }
          .clientHistoryTable th:nth-child(5) { width: 14%; }
          .clientHistoryTable th:nth-child(6) { width: 14%; }
          .clientHistoryTable td small {
            display: block;
            margin: 0 0 4px;
            color: #647185;
            line-height: 1.35;
          }
          @media (max-width: 780px) {
            .clientHistory {
              width: calc(100vw - 20px);
              padding: 20px 16px;
            }
            .clientHistoryStats {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .clientHistoryToolbar,
            .clientHistoryFilters {
              grid-template-columns: 1fr;
            }
            .clientHistoryTable {
              overflow-x: auto;
            }
            .clientHistoryTable table {
              min-width: 720px;
            }
          }
          @media (max-width: 480px) {
            .clientHistoryStats {
              grid-template-columns: 1fr;
            }
            .clientHistoryTitle {
              display: grid;
              gap: 5px;
            }
          }
          '''

          app_path.write_text(app, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          PY

          python /tmp/patch.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/improve-client-history.yml
          git add src/App.tsx src/index.css
          git commit -m "Melhora visual e filtros do histórico de clientes"
          git push origin HEAD:codex/ajustar-seletor-pedidos
