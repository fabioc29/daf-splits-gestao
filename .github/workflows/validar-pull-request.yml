name: Validar Pull Request

on:
  pull_request:
    branches:
      - fabio
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build da aplicação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        run: npm run build
