name: Update accumulating label

on:
  push:
    branches:
      - codex/ajustar-seletor-pedidos

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-accumulating-label]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update selector label
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = '<option value="accumulating">Vai acumular mais decantes</option>'
          new = '<option value="accumulating">Vai acumular</option>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one selector label, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-accumulating-label.yml
          git add src/App.tsx
          git commit -m "Encurta opção de acumular decantes [skip-accumulating-label]"
          git push origin HEAD:codex/ajustar-seletor-pedidos
