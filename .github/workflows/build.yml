name: Validar build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: https://wcsiyqhuofygyajbztjk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
        run: npm run build
