name: Aplicar correções operacionais do dashboard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-dashboard-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correções
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          css_path = Path('src/index.css')
          app = app_path.read_text()
          css = css_path.read_text()

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Trecho não encontrado: {label}')
              return text.replace(old, new, 1)

          app = replace_once(
              app,
              'import { useEffect, useMemo, useRef, useState } from "react";',
              'import { useEffect, useMemo, useState } from "react";',
              'remover useRef',
          )
          app = replace_once(
              app,
              '  const saveTimer = useRef<number | undefined>(undefined);\n',
              '',
              'remover debounce antigo',
          )

          old_save = '''  useEffect(() => {
              localStorage.setItem("daf-v4", JSON.stringify(data));
              if (!ready) return;
              setSync("loading");
              window.clearTimeout(saveTimer.current);
              saveTimer.current = window.setTimeout(async () => {
                const { error } = await supabase
                  .from("app_state")
                  .upsert({ user_id: session.user.id, data });
                setSync(error ? "error" : "saved");
              }, 450);
              return () => window.clearTimeout(saveTimer.current);
            }, [data, ready, session.user.id]);'''
          new_save = '''  useEffect(() => {
              localStorage.setItem("daf-v4", JSON.stringify(data));
              if (!ready) return;
              let active = true;
              setSync("loading");
              void (async () => {
                const { error } = await supabase
                  .from("app_state")
                  .upsert({ user_id: session.user.id, data });
                if (active) setSync(error ? "error" : "saved");
              })();
              return () => {
                active = false;
              };
            }, [data, ready, session.user.id]);'''
          app = replace_once(app, old_save, new_save, 'salvamento imediato')

          app = replace_once(
              app,
              '.reduce((n, s) => n + s.total, 0),\n  );\n  const avg = daily',
              '.reduce((n, s) => n + Math.max(0, s.paid), 0),\n  );\n  const avg = daily',
              'faturamento diário recebido',
          )
          app = replace_once(
              app,
              '      return sum + (s.total * categoryMl) / totalMl;',
              '      return sum + (Math.max(0, s.paid) * categoryMl) / totalMl;',
              'categorias por valor recebido',
          )
          app = replace_once(
              app,
              '''          [brl(totals.gross), "Faturamento mensal"],
                    [brl(totals.paid), "Total recebido"],
                    [brl(totals.gross - totals.paid), "A receber"],
                    [brl(totals.gross / (activeSales.length || 1)), "Ticket médio"],''',
              '''          [brl(totals.paid), "Faturamento mensal"],
                    [brl(totals.gross), "Total vendido"],
                    [brl(totals.gross - totals.paid), "A receber"],
                    [
                      brl(
                        totals.paid /
                          (activeSales.filter((sale) => sale.paid > 0).length || 1),
                      ),
                      "Ticket médio recebido",
                    ],''',
              'cards da visão geral',
          )

          old_market = '''function MarketplaceSummary({ sales }: { sales: V[] }) {
            const gross = sales.reduce((sum, sale) => sum + sale.total, 0);
            const tiktok = sales
              .filter((sale) => sale.marketplace === "TikTok Shop")
              .reduce((sum, sale) => sum + sale.total, 0);
            const shopee = sales
              .filter((sale) => sale.marketplace === "Shopee")
              .reduce((sum, sale) => sum + sale.total, 0);'''
          new_market = '''function MarketplaceSummary({ sales }: { sales: V[] }) {
            const gross = sales.reduce((sum, sale) => sum + Math.max(0, sale.paid), 0);
            const tiktok = sales
              .filter((sale) => sale.marketplace === "TikTok Shop")
              .reduce((sum, sale) => sum + Math.max(0, sale.paid), 0);
            const shopee = sales
              .filter((sale) => sale.marketplace === "Shopee")
              .reduce((sum, sale) => sum + Math.max(0, sale.paid), 0);'''
          app = replace_once(app, old_market, new_market, 'marketplace recebido')

          old_payment = '''    value: d.sales
                .filter((s) => s.status !== "cancelled" && s.payment === x.name)
                .reduce((n, s) => n + s.total, 0),'''
          new_payment = '''    value: d.sales
                .filter(
                  (s) =>
                    s.status !== "cancelled" &&
                    !isNoCost(s) &&
                    s.payment === x.name,
                )
                .reduce((n, s) => n + Math.max(0, s.paid), 0),'''
          app = replace_once(app, old_payment, new_payment, 'formas de pagamento recebidas')
          app = replace_once(
              app,
              '        <p>Distribuição do faturamento entre Pix, cartão e vendas a prazo.</p>',
              '        <p>Distribuição do faturamento já recebido entre Pix, cartão e vendas a prazo.</p>',
              'descrição de faturamento',
          )
          app = replace_once(
              app,
              '            <small>Total vendido</small>',
              '            <small>Total recebido</small>',
              'rótulo total recebido',
          )
          app = replace_once(
              app,
              '''          [brl(totals.gross), "Faturamento"],
                    [brl(totals.paid), "Recebido"],
                    [brl(totals.gross - totals.paid), "A receber"],''',
              '''          [brl(totals.paid), "Faturamento"],
                    [brl(totals.gross), "Total vendido"],
                    [brl(totals.gross - totals.paid), "A receber"],''',
              'cards do financeiro',
          )

          mobile_old = '''@media (max-width: 720px) {
            aside {
              transform: translateX(-100%);
            }
            main {
              margin: 0;
              width: 100%;
            }'''
          mobile_new = '''@media (max-width: 720px) {
            aside {
              transform: none;
              inset: auto 0 0 0;
              width: 100%;
              height: 78px;
              padding: 8px;
              z-index: 60;
              overflow-x: auto;
              overflow-y: hidden;
              border-top: 1px solid #2a2a2a;
            }
            aside > img,
            aside > .sync,
            aside > footer {
              display: none;
            }
            aside nav {
              display: flex;
              gap: 6px;
              width: max-content;
              min-width: 100%;
            }
            aside nav button {
              min-width: 76px;
              min-height: 60px;
              padding: 6px 9px;
              flex-direction: column;
              justify-content: center;
              gap: 2px;
              font-size: 9px;
              text-align: center;
            }
            aside nav button .navAlert {
              position: absolute;
              margin: -35px 0 0 42px;
            }
            main {
              margin: 0;
              width: 100%;
              padding-bottom: 92px;
            }'''
          css = replace_once(css, mobile_old, mobile_new, 'navegação móvel')

          app_path.write_text(app)
          css_path.write_text(css)
          PY

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar build
        env:
          VITE_SUPABASE_URL: https://wcsiyqhuofygyajbztjk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key
        run: npm run build

      - name: Salvar correções na main
        shell: bash
        run: |
          if git diff --quiet -- src/App.tsx src/index.css; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/index.css
          git commit -m "fix: corrige faturamento, persistência e navegação móvel"
          git push
