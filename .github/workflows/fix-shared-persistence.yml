name: Corrigir persistencia compartilhada

on:
  push:
    branches:
      - feature/reintegrar-supabase-catalogo
    paths:
      - .github/workflows/fix-shared-persistence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correcao de persistencia
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/App.tsx')
          text = p.read_text()

          old_read = '''      const { data: remote, error } = await supabase
        .from("app_state")
        .select("data")
        .eq("user_id", session.user.id)
        .maybeSingle();'''
          new_read = '''      const { data: remote, error } = await supabase
        .from("management_state")
        .select("data")
        .eq("id", 1)
        .maybeSingle();'''

          old_latest = '''      const { data: latestRow, error: readError } = await supabase
        .from("app_state")
        .select("data")
        .eq("user_id", session.user.id)
        .maybeSingle();'''
          new_latest = '''      const { data: latestRow, error: readError } = await supabase
        .from("management_state")
        .select("data")
        .eq("id", 1)
        .maybeSingle();'''

          old_upsert_chosen = '''        const { error: saveError } = await supabase
          .from("app_state")
          .upsert({ user_id: session.user.id, data: chosen });'''
          new_upsert_chosen = '''        const { error: saveError } = await supabase
          .from("management_state")
          .upsert({ id: 1, data: chosen, updated_by: session.user.id });'''

          old_upsert_payload = '''      const { error } = await supabase
        .from("app_state")
        .upsert({ user_id: session.user.id, data: payload });'''
          new_upsert_payload = '''      const { error } = await supabase
        .from("management_state")
        .upsert({ id: 1, data: payload, updated_by: session.user.id });'''

          replacements = [
              (old_latest, new_latest, 1, 'leitura durante salvamento'),
              (old_upsert_chosen, new_upsert_chosen, 1, 'salvamento inicial'),
              (old_upsert_payload, new_upsert_payload, 1, 'salvamento de alteracoes'),
          ]

          for old, new, count, label in replacements:
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{label}: esperado {count}, encontrado {found}')
              text = text.replace(old, new, count)

          # A mesma leitura simples ocorre duas vezes: carga inicial e refresh periodico.
          found = text.count(old_read)
          if found != 2:
              raise SystemExit(f'leituras compartilhadas: esperado 2, encontrado {found}')
          text = text.replace(old_read, new_read)

          if '.from("app_state")' in text:
              raise SystemExit('Ainda restaram referencias a app_state em App.tsx')

          p.write_text(text)
          PY

      - name: Validar build
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: https://wcsiyqhuofygyajbztjk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: build-placeholder-key

      - name: Commitar correcao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix: persiste dashboard no estado compartilhado"
          git push
