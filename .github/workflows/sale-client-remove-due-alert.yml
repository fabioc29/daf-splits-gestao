name: Apply sale client, perfume removal and receivable due alert

on:
  push:
    branches:
      - codex/ajustar-seletor-pedidos

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply requested changes
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          app_path = Path("src/App.tsx")
          css_path = Path("src/index.css")
          app = app_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          def rep(old, new, label):
              global app
              if old not in app:
                  raise SystemExit("Pattern not found: " + label)
              app = app.replace(old, new, 1)

          def sub(pattern, new, label):
              global app
              app, count = re.subn(pattern, new, app, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit("Pattern not found: " + label)

          rep(
              '  const action =\n    page === "sales"',
              '''  const receivableDueAlert = (() => {
            const currentDate = today();
            let dueToday = false;
            let overdue = false;
            for (const sale of data.sales) {
              if (
                sale.status === "cancelled" ||
                isNoCost(sale) ||
                isMarketplaceSale(sale) ||
                sale.paid >= sale.total
              )
                continue;
              if (sale.installments?.length) {
                const scheduleTotal = sale.installments.reduce(
                  (sum, installment) =>
                    sum + Math.max(0, Number(installment.amount) || 0),
                  0,
                );
                const paidTowardSchedule = Math.max(
                  0,
                  sale.paid - Math.max(0, sale.total - scheduleTotal),
                );
                let accumulated = 0;
                for (const installment of sale.installments) {
                  accumulated += Math.max(
                    0,
                    Number(installment.amount) || 0,
                  );
                  const settled =
                    Boolean(installment.paid) ||
                    accumulated <= paidTowardSchedule + 0.01;
                  if (settled || !installment.date) continue;
                  if (installment.date < currentDate) overdue = true;
                  else if (installment.date === currentDate) dueToday = true;
                }
              } else if (sale.dueDate) {
                if (sale.dueDate < currentDate) overdue = true;
                else if (sale.dueDate === currentDate) dueToday = true;
              }
            }
            return overdue ? "overdue" : dueToday ? "today" : null;
          })();
          const action =
            page === "sales"''',
              "due alert calculation",
          )

          sub(
              r'''              \{navAlerts\[id\] \? \(\n.*?              \) : null\}''',
              '''              {navAlerts[id] || (id === "receivables" && receivableDueAlert) ? (
                <span className="navAlertGroup">
                  {id === "receivables" && receivableDueAlert ? (
                    <span
                      className={"receivableDueAlert " + receivableDueAlert}
                      aria-label={
                        receivableDueAlert === "overdue"
                          ? "Há parcela atrasada"
                          : "Há parcela vencendo hoje"
                      }
                      title={
                        receivableDueAlert === "overdue"
                          ? "Há parcela atrasada"
                          : "Há parcela vencendo hoje"
                      }
                    />
                  ) : null}
                  {navAlerts[id] ? (
                    <span
                      className="navAlert"
                      aria-label={String(navAlerts[id]) + " pendente(s)"}
                    >
                      {navAlerts[id]}
                    </span>
                  ) : null}
                </span>
              ) : null}''',
              "nav alert markup",
          )

          sub(
              r'''                \) : \(\n                  <Select\n                    n="clientId"\n                    l="Cliente"\n                    value=\{existingSale\?\.clientId\}\n                    o=\{d\.clients\.map\(\(c\) => \[c\.id, c\.name\]\)\}\n                  />\n                \)\}''',
              '''                ) : (
                  <label className="saleClientInput">
                    <span>Cliente</span>
                    <input
                      name="clientName"
                      list="sale-client-options"
                      defaultValue={existingSale ? saleCustomer(existingSale, d) : ""}
                      placeholder="Selecione ou digite o nome do cliente"
                      required
                    />
                    <datalist id="sale-client-options">
                      {d.clients.map((client) => (
                        <option key={client.id} value={client.name} />
                      ))}
                    </datalist>
                  </label>
                )}''',
              "typed client field",
          )

          rep(
              '''    [lines, setLines] = useState(existingSale?.items.length || 1),
              [apcLines, setApcLines] = useState<boolean[]>(''',
              '''    [lines, setLines] = useState(existingSale?.items.length || 1),
              [removedLines, setRemovedLines] = useState<Set<number>>(new Set()),
              [apcLines, setApcLines] = useState<boolean[]>(''',
              "removed lines state",
          )

          rep(
              '''  const [shippingPaidBy, setShippingPaidBy] = useState<"Cliente" | "DAF">(
            existingSale?.shippingPaidBy === "daf" || Number(existingSale?.shippingCost || 0) > 0
              ? "DAF"
              : "Cliente",
          );
          function findClientByCpf''',
              '''  const [shippingPaidBy, setShippingPaidBy] = useState<"Cliente" | "DAF">(
            existingSale?.shippingPaidBy === "daf" || Number(existingSale?.shippingCost || 0) > 0
              ? "DAF"
              : "Cliente",
          );
          const activeLineIndexes = Array.from(
            { length: lines },
            (_, index) => index,
          ).filter((index) => !removedLines.has(index));
          function removeSaleLine(index: number) {
            if (activeLineIndexes.length <= 1) return;
            setRemovedLines((current) => {
              const next = new Set(current);
              next.add(index);
              return next;
            });
          }
          function findClientByCpf''',
              "active lines",
          )

          rep(
              '''      const invalid = Array.from({ length: lines }, (_, i) =>
                String(f["productName" + i] || ""),
              ).find(
                (typed) => !d.products.some((p) => `${p.brand} ${p.name}` === typed),
              );''',
              '''      const invalid = activeLineIndexes
                .map((i) => String(f["productName" + i] || ""))
                .find(
                  (typed) => !d.products.some((p) => `${p.brand} ${p.name}` === typed),
                );''',
              "active validation",
          )

          rep(
              '''      const apcProducts = Array.from({ length: lines }, (_, i) => {
                if (!apcLines[i]) return null;
                const typed = String(f["productName" + i] || "");
                return d.products.find((p) => `${p.brand} ${p.name}` === typed);
              }).filter(Boolean) as P[];''',
              '''      const apcProducts = activeLineIndexes
                .map((i) => {
                  if (!apcLines[i]) return null;
                  const typed = String(f["productName" + i] || "");
                  return d.products.find((p) => `${p.brand} ${p.name}` === typed);
                })
                .filter(Boolean) as P[];''',
              "active apc validation",
          )

          rep(
              '''      let clientId = isMarketplace ? 0 : Number(f.clientId),
                clients = x.clients;
              if (newClient && !isMarketplace) {''',
              '''      const typedClientName = isMarketplace
                ? ""
                : String(f.clientName || "").trim();
              const matchedClient = isMarketplace
                ? undefined
                : x.clients.find(
                    (client) =>
                      client.name.trim().toLowerCase() ===
                      typedClientName.toLowerCase(),
                  );
              let clientId = isMarketplace ? 0 : matchedClient?.id || 0,
                clients = x.clients;
              if (newClient && !isMarketplace) {''',
              "client resolution",
          )

          rep(
              '''      const items = Array.from({ length: lines }, (_, i) => {
                const typed = String(f["productName" + i] || "");
                const product = x.products.find(
                  (p) => `${p.brand} ${p.name}` === typed,
                );
                return {
                  productId: product?.id || Number(f["product" + i]),
                  ml: parseDecimal(f["ml" + i]),
                  isApc: Boolean(apcLines[i]),
                  unitCost: existingSale?.items[i]?.unitCost ?? product?.cost ?? 0,
                };
              });''',
              '''      const items = activeLineIndexes.map((i) => {
                const typed = String(f["productName" + i] || "");
                const product = x.products.find(
                  (p) => `${p.brand} ${p.name}` === typed,
                );
                return {
                  productId: product?.id || Number(f["product" + i]),
                  ml: parseDecimal(f["ml" + i]),
                  isApc: Boolean(apcLines[i]),
                  unitCost: existingSale?.items[i]?.unitCost ?? product?.cost ?? 0,
                };
              });''',
              "active sale items",
          )

          rep(
              '''        customerName: isMarketplace
                  ? String(f.marketplaceCustomer || "").trim()
                  : undefined,''',
              '''        customerName: isMarketplace
                  ? String(f.marketplaceCustomer || "").trim()
                  : newClient || matchedClient
                    ? undefined
                    : typedClientName || undefined,''',
              "manual direct customer",
          )

          old_render = '''            {Array.from({ length: lines }, (_, i) => (
              <div className="row item" key={i}>
                <ProductSearch
                  index={i}
                  products={d.products.filter(
                    (p) =>
                      p.stock > 0 ||
                      existingSale?.items.some((x) => x.productId === p.id),
                  )}
                  value={existingSale?.items[i]?.productId}
                />
                <div className="volumeApc">
                  <Field
                    n={"ml" + i}
                    l="Volume (ml)"
                    decimalOnly
                    v={existingSale?.items[i]?.ml}
                    onChange={(event) =>
                      setSaleVolumes((current) => {
                        const next = [...current];
                        next[i] = parseDecimal(event.target.value);
                        return next;
                      })
                    }
                  />
                  <button
                    type="button"
                    className={apcLines[i] ? "apcButton active" : "apcButton"}
                    aria-pressed={Boolean(apcLines[i])}
                    onClick={() =>
                      setApcLines((current) => {
                        const next = [...current];
                        next[i] = !next[i];
                        return next;
                      })
                    }
                  >
                    APC
                  </button>
                </div>
              </div>
            ))}'''
          new_render = '''            {activeLineIndexes.map((i, visibleIndex) => (
              <div className="saleItemGroup" key={i}>
                <div className="row item">
                  <ProductSearch
                    index={i}
                    labelIndex={visibleIndex}
                    products={d.products.filter(
                      (p) =>
                        p.stock > 0 ||
                        existingSale?.items.some((x) => x.productId === p.id),
                    )}
                    value={existingSale?.items[i]?.productId}
                  />
                  <div className="volumeApc">
                    <Field
                      n={"ml" + i}
                      l="Volume (ml)"
                      decimalOnly
                      v={existingSale?.items[i]?.ml}
                      onChange={(event) =>
                        setSaleVolumes((current) => {
                          const next = [...current];
                          next[i] = parseDecimal(event.target.value);
                          return next;
                        })
                      }
                    />
                    <button
                      type="button"
                      className={apcLines[i] ? "apcButton active" : "apcButton"}
                      aria-pressed={Boolean(apcLines[i])}
                      onClick={() =>
                        setApcLines((current) => {
                          const next = [...current];
                          next[i] = !next[i];
                          return next;
                        })
                      }
                    >
                      APC
                    </button>
                  </div>
                </div>
                {activeLineIndexes.length > 1 ? (
                  <button
                    type="button"
                    className="removeSaleItem"
                    onClick={() => removeSaleLine(i)}
                  >
                    <Trash2 />
                    Excluir perfume
                  </button>
                ) : null}
              </div>
            ))}'''
          rep(old_render, new_render, "per-line perfume removal")

          rep(
              '''              items={Array.from({ length: lines }, (_, index) => ({
                ml: saleVolumes[index] || 0,
                isApc: Boolean(apcLines[index]),
              }))}''',
              '''              items={activeLineIndexes.map((index) => ({
                ml: saleVolumes[index] || 0,
                isApc: Boolean(apcLines[index]),
              }))}''',
              "active supply lines",
          )

          rep(
              '''function ProductSearch({
            index,
            products,
            value,
          }: {
            index: number;
            products: P[];
            value?: number;
          }) {''',
              '''function ProductSearch({
            index,
            labelIndex,
            products,
            value,
          }: {
            index: number;
            labelIndex?: number;
            products: P[];
            value?: number;
          }) {''',
              "product search display index",
          )
          rep(
              '      <span>Perfume {index + 1}</span>',
              '      <span>Perfume {(labelIndex ?? index) + 1}</span>',
              "product search label",
          )

          css += '''

          /* Sale client typing, perfume removal and receivable due alerts */
          .saleClientInput input {
            width: 100%;
          }
          .saleItemGroup {
            display: grid;
            gap: 7px;
          }
          .removeSaleItem {
            justify-self: end;
            border: 0;
            background: transparent;
            color: #d9575d;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 4px 7px;
          }
          .removeSaleItem svg {
            width: 14px;
            height: 14px;
          }
          .navAlertGroup {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
          }
          .navAlertGroup .navAlert {
            margin-left: 0;
          }
          .receivableDueAlert {
            width: 11px;
            height: 11px;
            flex: 0 0 11px;
            border-radius: 999px;
            animation: receivableDuePulse 1.05s ease-in-out infinite;
          }
          .receivableDueAlert.today {
            background: #f0c33c;
            box-shadow: 0 0 0 4px rgb(240 195 60 / 18%);
          }
          .receivableDueAlert.overdue {
            background: #e5484d;
            box-shadow: 0 0 0 4px rgb(229 72 77 / 18%);
          }
          @keyframes receivableDuePulse {
            0%, 100% {
              opacity: 1;
              transform: scale(1);
            }
            50% {
              opacity: 0.38;
              transform: scale(0.78);
            }
          }
          @media (max-width: 720px) {
            aside nav button .navAlertGroup {
              position: absolute;
              margin: -35px 0 0 42px;
              gap: 4px;
            }
            aside nav button .navAlertGroup .navAlert {
              position: static;
              margin: 0;
            }
            .receivableDueAlert {
              width: 9px;
              height: 9px;
              flex-basis: 9px;
            }
          }
          '''

          app_path.write_text(app, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          PY

          python /tmp/patch.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sale-client-remove-due-alert.yml
          git add src/App.tsx src/index.css
          git commit -m "Melhora cliente da venda, exclusão de perfume e alerta de parcelas"
          git push origin HEAD:codex/ajustar-seletor-pedidos
