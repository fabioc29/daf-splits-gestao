name: Apply sale client, perfume removal and receivable due alert

on:
  push:
    branches:
      - codex/ajustar-seletor-pedidos

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply requested changes
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          app_path = Path("src/App.tsx")
          css_path = Path("src/index.css")
          app = app_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          def rep(old, new, label):
              global app
              if old not in app:
                  raise SystemExit("Pattern not found: " + label)
              app = app.replace(old, new, 1)

          def sub(pattern, new, label):
              global app
              app, count = re.subn(pattern, new, app, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit("Pattern not found: " + label)

          rep(
              '  const action =\n    page === "sales"',
              '''  const receivableDueAlert = (() => {
            const currentDate = today();
            let dueToday = false;
            let overdue = false;
            for (const sale of data.sales) {
              if (
                sale.status === "cancelled" ||
                isNoCost(sale) ||
                isMarketplaceSale(sale) ||
                sale.paid >= sale.total
              )
                continue;
              if (sale.installments?.length) {
                const scheduleTotal = sale.installments.reduce(
                  (sum, installment) =>
                    sum + Math.max(0, Number(installment.amount) || 0),
                  0,
                );
                const paidTowardSchedule = Math.max(
                  0,
                  sale.paid - Math.max(0, sale.total - scheduleTotal),
                );
                let accumulated = 0;
                for (const installment of sale.installments) {
                  accumulated += Math.max(
                    0,
                    Number(installment.amount) || 0,
                  );
                  const settled =
                    Boolean(installment.paid) ||
                    accumulated <= paidTowardSchedule + 0.01;
                  if (settled || !installment.date) continue;
                  if (installment.date < currentDate) overdue = true;
                  else if (installment.date === currentDate) dueToday = true;
                }
              } else if (sale.dueDate) {
                if (sale.dueDate < currentDate) overdue = true;
                else if (sale.dueDate === currentDate) dueToday = true;
              }
            }
            return overdue ? "overdue" : dueToday ? "today" : null;
          })();
          const action =
            page === "sales"''',
              "due alert calculation",
          )

          sub(
              r'''              \{navAlerts\[id\] \? \(\n.*?\n              \) : null\}''',
              '''              {navAlerts[id] || (id === "receivables" && receivableDueAlert) ? (
                <span className="navAlertGroup">
                  {id === "receivables" && receivableDueAlert ? (
                    <span
                      className={"receivableDueAlert " + receivableDueAlert}
                      aria-label={
                        receivableDueAlert === "overdue"
                          ? "Há parcela atrasada"
                          : "Há parcela vencendo hoje"
                      }
                      title={
                        receivableDueAlert === "overdue"
                          ? "Há parcela atrasada"
                          : "Há parcela vencendo hoje"
                      }
                    />
                  ) : null}
                  {navAlerts[id] ? (
                    <span
                      className="navAlert"
                      aria-label={String(navAlerts[id]) + " pendente(s)"}
                    >
                      {navAlerts[id]}
                    </span>
                  ) : null}
                </span>
              ) : null}''',
              "nav alert markup",
          )

          sub(
              r'''                \) : \(\n                  <Select\n                    n="clientId"\n                    l="Cliente"\n                    value=\{existingSale\?\.clientId\}\n                    o=\{d\.clients\.map\(\(c\) => \[c\.id, c\.name\]\)\}\n                  />\n                \)\}''',
              '''                ) : (
                  <label className="saleClientInput">
                    <span>Cliente</span>
                    <input
                      name="clientName"
                      list="sale-client-options"
                      defaultValue={existingSale ? saleCustomer(existingSale, d) : ""}
                      placeholder="Selecione ou digite o nome do cliente"
                      required
                    />
                    <datalist id="sale-client-options">
                      {d.clients.map((client) => (
                        <option key={client.id} value={client.name} />
                      ))}
                    </datalist>
                  </label>
                )}''',
              "typed client field",
          )

          rep(
              '      let clientId = isMarketplace ? 0 : Number(f.clientId),\n        clients = x.clients;\n      if (newClient && !isMarketplace) {',
              '''      const typedClientName = isMarketplace
                ? ""
                : String(f.clientName || "").trim();
              const matchedClient = isMarketplace
                ? undefined
                : x.clients.find(
                    (client) =>
                      client.name.trim().toLowerCase() ===
                      typedClientName.toLowerCase(),
                  );
              let clientId = isMarketplace ? 0 : matchedClient?.id || 0,
                clients = x.clients;
              if (newClient && !isMarketplace) {''',
              "client resolution",
          )

          rep(
              '        customerName: isMarketplace\n          ? String(f.marketplaceCustomer || "").trim()\n          : undefined,',
              '''        customerName: isMarketplace
                  ? String(f.marketplaceCustomer || "").trim()
                  : newClient || matchedClient
                    ? undefined
                    : typedClientName || undefined,''',
              "manual direct customer",
          )

          rep(
              '''            <button
              type="button"
              className="add"
              onClick={() => setLines((n) => n + 1)}
            >
              <Plus />
              Adicionar outro perfume
            </button>''',
              '''            <div className="saleItemActions">
              <button
                type="button"
                className="add"
                onClick={() => setLines((n) => n + 1)}
              >
                <Plus />
                Adicionar outro perfume
              </button>
              {lines > 1 ? (
                <button
                  type="button"
                  className="removeSaleItem"
                  onClick={() => {
                    setLines((n) => Math.max(1, n - 1));
                    setApcLines((current) => current.slice(0, -1));
                    setSaleVolumes((current) => current.slice(0, -1));
                  }}
                >
                  <Trash2 />
                  Excluir perfume
                </button>
              ) : null}
            </div>''',
              "perfume removal button",
          )

          css += '''

          /* Sale client typing, perfume removal and receivable due alerts */
          .saleClientInput input {
            width: 100%;
          }
          .saleItemActions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
          }
          .removeSaleItem {
            border: 0;
            background: transparent;
            color: #d9575d;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 4px;
          }
          .removeSaleItem svg {
            width: 14px;
            height: 14px;
          }
          .navAlertGroup {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
          }
          .navAlertGroup .navAlert {
            margin-left: 0;
          }
          .receivableDueAlert {
            width: 11px;
            height: 11px;
            flex: 0 0 11px;
            border-radius: 999px;
            animation: receivableDuePulse 1.05s ease-in-out infinite;
          }
          .receivableDueAlert.today {
            background: #f0c33c;
            box-shadow: 0 0 0 4px rgb(240 195 60 / 18%);
          }
          .receivableDueAlert.overdue {
            background: #e5484d;
            box-shadow: 0 0 0 4px rgb(229 72 77 / 18%);
          }
          @keyframes receivableDuePulse {
            0%, 100% {
              opacity: 1;
              transform: scale(1);
            }
            50% {
              opacity: 0.38;
              transform: scale(0.78);
            }
          }
          @media (max-width: 720px) {
            aside nav button .navAlertGroup {
              position: absolute;
              margin: -35px 0 0 42px;
              gap: 4px;
            }
            aside nav button .navAlertGroup .navAlert {
              position: static;
              margin: 0;
            }
            .receivableDueAlert {
              width: 9px;
              height: 9px;
              flex-basis: 9px;
            }
          }
          '''

          app_path.write_text(app, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          PY

          python /tmp/patch.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sale-client-remove-due-alert.yml
          git add src/App.tsx src/index.css
          git commit -m "Melhora cliente da venda, exclusão de perfume e alerta de parcelas"
          git push origin HEAD:codex/ajustar-seletor-pedidos
