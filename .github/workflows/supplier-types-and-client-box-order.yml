name: Supplier types and client history box order

on:
  push:
    branches:
      - codex/ajustar-seletor-pedidos

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply supplier classification and history adjustments
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          app_path = Path("src/App.tsx")
          css_path = Path("src/index.css")
          app = app_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          def rep(old, new, label):
              global app
              if old not in app:
                  raise SystemExit("Pattern not found: " + label)
              app = app.replace(old, new, 1)

          rep(
              '''type B = {
            id: number;
            date: string;
            supplier: string;
            type: string;
            description: string;
            qty: number;
            total: number;
            mlPerBottle?: number;
            attachCost?: boolean;
          };
          type D = {''',
              '''type B = {
            id: number;
            date: string;
            supplier: string;
            type: string;
            description: string;
            qty: number;
            total: number;
            mlPerBottle?: number;
            attachCost?: boolean;
          };
          type SupplierType =
            | "Fornecedor de perfumes"
            | "Fornecedor de suprimentos/insumos"
            | "Fornecedor geral"
            | "Outros";
          const SUPPLIER_TYPES: SupplierType[] = [
            "Fornecedor de perfumes",
            "Fornecedor de suprimentos/insumos",
            "Fornecedor geral",
            "Outros",
          ];
          type D = {''',
              "supplier type definition",
          )

          rep(
              '''  purchases: B[];
            suppliers: string[];
            brands: string[];''',
              '''  purchases: B[];
            suppliers: string[];
            supplierTypes: Record<string, SupplierType>;
            brands: string[];''',
              "supplier types in data",
          )

          rep(
              '''  purchases: [],
            suppliers: [],
            brands: [],''',
              '''  purchases: [],
            suppliers: [],
            supplierTypes: {},
            brands: [],''',
              "supplier types blank",
          )

          rep(
              '''  const suppliers = [...supplierByKey.values()];
            const purchases = (merged.purchases || []).map((purchase: B) => {''',
              '''  const suppliers = [...supplierByKey.values()];
            const storedSupplierTypes = merged.supplierTypes || {};
            const storedSupplierTypeByKey = new Map<string, SupplierType>(
              Object.entries(storedSupplierTypes)
                .map(([name, type]) => [
                  supplierKey(name),
                  SUPPLIER_TYPES.includes(type as SupplierType)
                    ? (type as SupplierType)
                    : "Outros",
                ]),
            );
            const supplierTypes = Object.fromEntries(
              suppliers.map((name) => {
                const key = supplierKey(name);
                const forcedType: SupplierType | undefined =
                  key === supplierKey("The King of Parfums") ||
                  key === supplierKey("TW Perfumes")
                    ? "Fornecedor de perfumes"
                    : key === supplierKey("Mercado Livre")
                      ? "Fornecedor geral"
                      : undefined;
                return [
                  name,
                  forcedType ||
                    storedSupplierTypeByKey.get(key) ||
                    "Outros",
                ];
              }),
            ) as Record<string, SupplierType>;
            const purchases = (merged.purchases || []).map((purchase: B) => {''',
              "normalize supplier types",
          )

          rep(
              "    supplies: normalizedSupplies,\n    suppliers,\n    brands,",
              "    supplies: normalizedSupplies,\n    suppliers,\n    supplierTypes,\n    brands,",
              "normalized return supplier types",
          )

          rep(
              '''    set((state: D) => ({
              ...state,
              suppliers: state.suppliers.filter((_, current) => current !== index),
            }));''',
              '''    set((state: D) => ({
              ...state,
              suppliers: state.suppliers.filter((_, current) => current !== index),
              supplierTypes: Object.fromEntries(
                Object.entries(state.supplierTypes || {}).filter(
                  ([supplierName]) => supplierName !== name,
                ),
              ) as Record<string, SupplierType>,
            }));''',
              "remove supplier type",
          )

          rep(
              '''  const purchases = d.purchases
              .filter((purchase) => purchase.supplier === name)
              .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
            const supplierSince = purchases.length''',
              '''  const purchases = d.purchases
              .filter((purchase) => purchase.supplier === name)
              .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
            const supplierType = d.supplierTypes?.[name] || "Outros";
            const isPerfumeSupplier =
              supplierType === "Fornecedor de perfumes";
            const supplierSince = purchases.length''',
              "supplier history type",
          )

          rep(
              '''  const totalUnits = purchases.reduce(
              (sum, purchase) => sum + Math.max(0, Number(purchase.qty) || 0),
              0,
            );''',
              '''  const totalUnits = purchases
              .filter((purchase) => purchase.type === "Perfume")
              .reduce(
                (sum, purchase) =>
                  sum + Math.max(0, Number(purchase.qty) || 0),
                0,
              );''',
              "perfume supplier units",
          )

          rep(
              '''          <div className="supplierHistoryStats">
                    <div>
                      <span>Compras registradas</span>
                      <b>{purchases.length}</b>
                    </div>
                    <div>
                      <span>Total comprado</span>
                      <b>{brl(total)}</b>
                    </div>
                    <div>
                      <span>Unidades compradas</span>
                      <b>{totalUnits}</b>
                    </div>
                    <div>
                      <span>Última compra</span>
                      <b>
                        {purchases[0]
                          ? dateBR(purchases[0].date)
                          : "Sem compras"}
                      </b>
                    </div>
                  </div>''',
              '''          <div
                    className={
                      "supplierHistoryStats " +
                      (isPerfumeSupplier ? "four" : "three")
                    }
                  >
                    <div>
                      <span>Compras registradas</span>
                      <b>{purchases.length}</b>
                    </div>
                    <div>
                      <span>Total comprado</span>
                      <b>{brl(total)}</b>
                    </div>
                    {isPerfumeSupplier ? (
                      <div>
                        <span>Unidades compradas</span>
                        <b>{totalUnits}</b>
                      </div>
                    ) : null}
                    <div>
                      <span>Última compra</span>
                      <b>
                        {purchases[0]
                          ? dateBR(purchases[0].date)
                          : "Sem compras"}
                      </b>
                    </div>
                  </div>''',
              "supplier history conditional units",
          )

          rep(
              '''    existingSupplier =
              type === "supplier" && modal!.id !== undefined
                ? d.suppliers[modal!.id]
                : undefined;
            const isOldSale''',
              '''    existingSupplier =
              type === "supplier" && modal!.id !== undefined
                ? d.suppliers[modal!.id]
                : undefined,
            existingSupplierType =
              existingSupplier !== undefined
                ? d.supplierTypes?.[existingSupplier] || "Outros"
                : "Outros";
            const isOldSale''',
              "existing supplier type",
          )

          rep(
              '''      if (type === "supplier") {
                const supplierName = String(f.name).trim();
                if (existingSupplier !== undefined && modal!.id !== undefined) {
                  return {
                    ...x,
                    suppliers: x.suppliers.map((name, index) =>
                      index === modal!.id ? supplierName : name,
                    ),
                    purchases: x.purchases.map((purchase) =>
                      purchase.supplier === existingSupplier
                        ? { ...purchase, supplier: supplierName }
                        : purchase,
                    ),
                  };
                }
                return { ...x, suppliers: [...x.suppliers, supplierName] };
              }''',
              '''      if (type === "supplier") {
                const supplierName = String(f.name).trim();
                const supplierType = SUPPLIER_TYPES.includes(
                  String(f.supplierType) as SupplierType,
                )
                  ? (String(f.supplierType) as SupplierType)
                  : "Outros";
                if (existingSupplier !== undefined && modal!.id !== undefined) {
                  const supplierTypes = Object.fromEntries(
                    Object.entries(x.supplierTypes || {}).filter(
                      ([name]) => name !== existingSupplier,
                    ),
                  ) as Record<string, SupplierType>;
                  supplierTypes[supplierName] = supplierType;
                  return {
                    ...x,
                    suppliers: x.suppliers.map((name, index) =>
                      index === modal!.id ? supplierName : name,
                    ),
                    supplierTypes,
                    purchases: x.purchases.map((purchase) =>
                      purchase.supplier === existingSupplier
                        ? { ...purchase, supplier: supplierName }
                        : purchase,
                    ),
                  };
                }
                return {
                  ...x,
                  suppliers: [...x.suppliers, supplierName],
                  supplierTypes: {
                    ...(x.supplierTypes || {}),
                    [supplierName]: supplierType,
                  },
                };
              }''',
              "save supplier type",
          )

          rep(
              '''        return {
                  ...x,
                  products,
                  supplies,
                  brands,
                  purchases: [purchase, ...x.purchases],
                  suppliers: x.suppliers.some(
                    (name) => name.toLowerCase() === supplier.toLowerCase(),
                  )
                    ? x.suppliers
                    : [...x.suppliers, supplier],
                };''',
              '''        const supplierAlreadyExists = x.suppliers.some(
                  (name) => name.toLowerCase() === supplier.toLowerCase(),
                );
                const supplierType = newSupplier
                  ? SUPPLIER_TYPES.includes(
                      String(f.newSupplierType) as SupplierType,
                    )
                    ? (String(f.newSupplierType) as SupplierType)
                    : "Outros"
                  : undefined;
                return {
                  ...x,
                  products,
                  supplies,
                  brands,
                  purchases: [purchase, ...x.purchases],
                  suppliers: supplierAlreadyExists
                    ? x.suppliers
                    : [...x.suppliers, supplier],
                  supplierTypes:
                    newSupplier && !supplierAlreadyExists
                      ? {
                          ...(x.supplierTypes || {}),
                          [supplier]: supplierType || "Outros",
                        }
                      : x.supplierTypes,
                };''',
              "purchase supplier type save",
          )

          rep(
              '''            {newSupplier ? (
              <Field n="newSupplier" l="Novo fornecedor" />
            ) : (
              <Select
                n="supplier"
                l="Fornecedor cadastrado"
                o={d.suppliers.map((s) => [s, s])}
              />
            )}''',
              '''            {newSupplier ? (
              <>
                <Field n="newSupplier" l="Novo fornecedor" />
                <Choices
                  name="newSupplierType"
                  label="Tipo de fornecedor"
                  a={SUPPLIER_TYPES}
                  v="Outros"
                />
              </>
            ) : (
              <Select
                n="supplier"
                l="Fornecedor cadastrado"
                o={d.suppliers.map((s) => [s, s])}
              />
            )}''',
              "new supplier type in purchase",
          )

          rep(
              '''        {type === "supplier" ? (
              <Field
                n="name"
                l="Nome do fornecedor"
                v={existingSupplier || ""}
              />
            ) : null}''',
              '''        {type === "supplier" ? (
              <>
                <Field
                  n="name"
                  l="Nome do fornecedor"
                  v={existingSupplier || ""}
                />
                <Choices
                  name="supplierType"
                  label="Tipo de fornecedor"
                  a={SUPPLIER_TYPES}
                  v={existingSupplierType}
                />
              </>
            ) : null}''',
              "supplier form type selector",
          )

          rep(
              '''          <div>
            <span>Valor total comprado</span>
            <b>{brl(totalPurchased)}</b>
          </div>
          <div>
            <span>Frascos comprados</span>
            <b>{bottleCount}</b>
          </div>
          <div>
            <span>APC's comprados</span>
            <b>{apcCount}</b>
          </div>
          <div>
            <span>Pedidos realizados</span>
            <b>{completedSales.length}</b>
          </div>
          <div>''',
              '''          <div>
            <span>Valor total comprado</span>
            <b>{brl(totalPurchased)}</b>
          </div>
          <div>
            <span>Pedidos realizados</span>
            <b>{completedSales.length}</b>
          </div>
          <div>
            <span>Frascos comprados</span>
            <b>{bottleCount}</b>
          </div>
          <div>
            <span>APC's comprados</span>
            <b>{apcCount}</b>
          </div>
          <div>''',
              "client history box order",
          )

          css += '''

          /* Supplier type-aware history cards */
          .supplierHistoryStats.three {
            grid-template-columns: repeat(3, minmax(0, 1fr));
          }
          .supplierHistoryStats.four {
            grid-template-columns: repeat(4, minmax(0, 1fr));
          }
          @media (max-width: 900px) {
            .supplierHistoryStats.three,
            .supplierHistoryStats.four {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }
          @media (max-width: 480px) {
            .supplierHistoryStats.three,
            .supplierHistoryStats.four {
              grid-template-columns: 1fr;
            }
          }
          '''

          app_path.write_text(app, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          PY

          python /tmp/patch.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/supplier-types-and-client-box-order.yml
          git add src/App.tsx src/index.css
          git commit -m "Classifica fornecedores e ajusta históricos"
          git push origin HEAD:codex/ajustar-seletor-pedidos
