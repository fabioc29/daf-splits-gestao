name: Improve supplier history and APC counts

on:
  push:
    branches:
      - codex/ajustar-seletor-pedidos

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply history improvements
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          app_path = Path("src/App.tsx")
          css_path = Path("src/index.css")
          app = app_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          old_counts = '''  const bottleCount = completedSales.reduce(
            (sum, sale) => sum + sale.items.length,
            0,
          );'''
          new_counts = '''  const bottleCount = completedSales.reduce(
            (sum, sale) =>
              sum + sale.items.filter((item) => !item.isApc).length,
            0,
          );
          const apcCount = completedSales.reduce(
            (sum, sale) =>
              sum + sale.items.filter((item) => Boolean(item.isApc)).length,
            0,
          );'''
          if old_counts not in app:
              raise SystemExit("Client bottle count block not found")
          app = app.replace(old_counts, new_counts, 1)

          old_stats = '''          <div>
            <span>Frascos comprados</span>
            <b>{bottleCount}</b>
          </div>
          <div>
            <span>Pedidos realizados</span>
            <b>{completedSales.length}</b>
          </div>'''
          new_stats = '''          <div>
            <span>Frascos comprados</span>
            <b>{bottleCount}</b>
          </div>
          <div>
            <span>APC's comprados</span>
            <b>{apcCount}</b>
          </div>
          <div>
            <span>Pedidos realizados</span>
            <b>{completedSales.length}</b>
          </div>'''
          if old_stats not in app:
              raise SystemExit("Client stats block not found")
          app = app.replace(old_stats, new_stats, 1)

          supplier_pattern = r'''function SupplierHistory\(\{.*?\n\}\n\n(?=function PaymentBreakdown)'''
          supplier_replacement = r'''function SupplierHistory({
            name,
            d,
            close,
          }: {
            name: string;
            d: D;
            close: () => void;
          }) {
            const [query, setQuery] = useState("");
            const [showFilters, setShowFilters] = useState(false);
            const [month, setMonth] = useState("");
            const [purchaseDay, setPurchaseDay] = useState("");
            const purchases = d.purchases
              .filter((purchase) => purchase.supplier === name)
              .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
            const supplierSince = purchases.length
              ? purchases.reduce(
                  (earliest, purchase) =>
                    !earliest || purchase.date < earliest
                      ? purchase.date
                      : earliest,
                  "",
                )
              : "";
            const total = purchases.reduce(
              (sum, purchase) => sum + purchase.total,
              0,
            );
            const totalUnits = purchases.reduce(
              (sum, purchase) => sum + Math.max(0, Number(purchase.qty) || 0),
              0,
            );
            const filteredPurchases = purchases.filter((purchase) => {
              const productText = (
                purchase.description +
                " " +
                purchase.type
              ).toLowerCase();
              return (
                productText.includes(query.trim().toLowerCase()) &&
                (!month || purchase.date.startsWith(month)) &&
                (!purchaseDay || purchase.date === purchaseDay)
              );
            });
            return (
              <div className="overlay">
                <div className="history supplierHistory supplierHistoryImproved">
                  <header className="supplierHistoryHeader">
                    <div>
                      <small>HISTÓRICO DE COMPRAS</small>
                      <div className="supplierHistoryTitle">
                        <h2>{name}</h2>
                        <span>
                          Fornecedor desde{" "}
                          {supplierSince
                            ? dateBR(supplierSince)
                            : "data não informada"}
                        </span>
                      </div>
                    </div>
                    <button onClick={close} aria-label="Fechar histórico">
                      <X />
                    </button>
                  </header>

                  <div className="supplierHistoryStats">
                    <div>
                      <span>Compras registradas</span>
                      <b>{purchases.length}</b>
                    </div>
                    <div>
                      <span>Total comprado</span>
                      <b>{brl(total)}</b>
                    </div>
                    <div>
                      <span>Unidades compradas</span>
                      <b>{totalUnits}</b>
                    </div>
                    <div>
                      <span>Última compra</span>
                      <b>
                        {purchases[0]
                          ? dateBR(purchases[0].date)
                          : "Sem compras"}
                      </b>
                    </div>
                  </div>

                  <div className="supplierHistoryContent">
                    <div className="supplierHistoryContentHead">
                      <div>
                        <h3>Compras com este fornecedor</h3>
                        <p>
                          {month || purchaseDay
                            ? "Exibindo o período selecionado."
                            : "Histórico completo do fornecedor (lifetime)."}
                        </p>
                      </div>
                    </div>

                    <div className="supplierHistoryToolbar">
                      <label className="supplierHistorySearch">
                        <Search />
                        <input
                          value={query}
                          onChange={(event) => setQuery(event.target.value)}
                          placeholder="Pesquisar por produto comprado"
                          aria-label="Pesquisar produto no histórico do fornecedor"
                        />
                      </label>
                      <button
                        type="button"
                        className={
                          showFilters || month || purchaseDay
                            ? "historyFilterButton active"
                            : "historyFilterButton"
                        }
                        onClick={() => setShowFilters((visible) => !visible)}
                      >
                        <SlidersHorizontal />
                        Filtrar por data
                      </button>
                    </div>

                    {showFilters ? (
                      <div className="supplierHistoryFilters">
                        <label>
                          <span>Mês</span>
                          <input
                            type="month"
                            value={month}
                            onChange={(event) => {
                              setMonth(event.target.value);
                              if (event.target.value) setPurchaseDay("");
                            }}
                          />
                        </label>
                        <label>
                          <span>Data específica</span>
                          <input
                            type="date"
                            value={purchaseDay}
                            onChange={(event) => {
                              setPurchaseDay(event.target.value);
                              if (event.target.value) setMonth("");
                            }}
                          />
                        </label>
                        <button
                          type="button"
                          onClick={() => {
                            setMonth("");
                            setPurchaseDay("");
                          }}
                        >
                          Limpar filtro
                        </button>
                      </div>
                    ) : null}

                    <div className="supplierHistoryTable">
                      <table>
                        <thead>
                          <tr>
                            <th>Data</th>
                            <th>Tipo</th>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Total</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filteredPurchases.map((purchase) => (
                            <tr key={purchase.id}>
                              <td>{dateBR(purchase.date)}</td>
                              <td>{purchase.type}</td>
                              <td>{purchase.description}</td>
                              <td>
                                {purchase.qty}
                                {purchase.mlPerBottle
                                  ? " × " + purchase.mlPerBottle + " ml"
                                  : ""}
                              </td>
                              <td>
                                <b>{brl(purchase.total)}</b>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      {!filteredPurchases.length ? (
                        <p className="empty">
                          Nenhuma compra encontrada com estes filtros.
                        </p>
                      ) : null}
                    </div>
                  </div>
                </div>
              </div>
            );
          }

          '''
          app, count = re.subn(
              supplier_pattern,
              supplier_replacement,
              app,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("SupplierHistory component not found")

          css += r'''

          /* APC split in client metrics + improved supplier history */
          .clientHistoryStats {
            grid-template-columns: repeat(5, minmax(0, 1fr));
          }

          .supplierHistoryImproved {
            width: min(1080px, calc(100vw - 32px));
            max-height: calc(100vh - 30px);
            padding: 28px 30px;
            gap: 18px;
          }
          .supplierHistoryHeader {
            align-items: flex-start;
          }
          .supplierHistoryHeader > div > small {
            display: block;
            margin-bottom: 6px;
            color: #c89117;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.14em;
          }
          .supplierHistoryTitle {
            display: flex;
            align-items: baseline;
            gap: 14px;
            flex-wrap: wrap;
          }
          .supplierHistoryTitle h2 {
            margin: 0;
            color: #172233;
          }
          .supplierHistoryTitle span {
            color: #647185;
            font-size: 12px;
            font-weight: 800;
          }
          .supplierHistoryStats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
          }
          .supplierHistoryStats > div {
            border: 1px solid #d8dde5;
            border-radius: 13px;
            background: #fff;
            padding: 15px 16px;
            display: grid;
            gap: 7px;
            min-height: 92px;
          }
          .supplierHistoryStats span {
            color: #647185;
            font-size: 11px;
            font-weight: 800;
          }
          .supplierHistoryStats b {
            color: #172233;
            font-size: 20px;
            line-height: 1.15;
          }
          .supplierHistoryContent {
            border: 1px solid #d8dde5;
            border-radius: 15px;
            background: #fff;
            padding: 20px;
            display: grid;
            gap: 15px;
            min-width: 0;
          }
          .supplierHistoryContentHead h3 {
            margin: 0;
            color: #172233;
            font-size: 19px;
          }
          .supplierHistoryContentHead p {
            margin: 5px 0 0;
            color: #647185;
            font-size: 12px;
          }
          .supplierHistoryToolbar {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) auto;
            gap: 12px;
            align-items: center;
          }
          .supplierHistorySearch {
            position: relative;
          }
          .supplierHistorySearch svg {
            position: absolute;
            left: 13px;
            top: 13px;
            width: 18px;
            color: #7a8798;
          }
          .supplierHistorySearch input {
            width: 100%;
            height: 44px;
            border: 1px solid #cfd5dd;
            border-radius: 10px;
            background: #fff;
            color: #172233;
            padding: 0 13px 0 40px;
            font: inherit;
          }
          .supplierHistoryFilters {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            align-items: end;
            border-radius: 11px;
            background: #f4f1e9;
            padding: 12px;
          }
          .supplierHistoryFilters label {
            display: grid;
            gap: 5px;
          }
          .supplierHistoryFilters label span {
            color: #647185;
            font-size: 10px;
            font-weight: 800;
          }
          .supplierHistoryFilters input {
            height: 40px;
            border: 1px solid #cfd5dd;
            border-radius: 9px;
            background: #fff;
            color: #172233;
            padding: 0 10px;
          }
          .supplierHistoryFilters button {
            height: 40px;
            border: 1px solid #cfd5dd;
            border-radius: 9px;
            background: #fff;
            color: #172233;
            padding: 0 13px;
            font-weight: 800;
          }
          .supplierHistoryImproved .supplierHistoryTable {
            width: 100%;
            overflow: visible;
          }
          .supplierHistoryImproved .supplierHistoryTable table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
          }
          .supplierHistoryImproved .supplierHistoryTable th,
          .supplierHistoryImproved .supplierHistoryTable td {
            padding: 12px 10px;
            border-bottom: 1px solid #e0e4e9;
            text-align: left;
            vertical-align: top;
            white-space: normal;
            overflow-wrap: anywhere;
          }
          .supplierHistoryImproved .supplierHistoryTable th {
            color: #718096;
            font-size: 10px;
            font-weight: 800;
          }
          .supplierHistoryImproved .supplierHistoryTable td {
            color: #172233;
            font-size: 12px;
          }
          .supplierHistoryImproved .supplierHistoryTable td b {
            color: #172233;
            font-weight: 900;
          }
          .supplierHistoryImproved .supplierHistoryTable th:nth-child(1) { width: 15%; }
          .supplierHistoryImproved .supplierHistoryTable th:nth-child(2) { width: 18%; }
          .supplierHistoryImproved .supplierHistoryTable th:nth-child(3) { width: 35%; }
          .supplierHistoryImproved .supplierHistoryTable th:nth-child(4) { width: 17%; }
          .supplierHistoryImproved .supplierHistoryTable th:nth-child(5) { width: 15%; }

          @media (max-width: 900px) {
            .clientHistoryStats {
              grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .supplierHistoryStats {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }
          @media (max-width: 780px) {
            .supplierHistoryImproved {
              width: calc(100vw - 20px);
              padding: 20px 16px;
            }
            .supplierHistoryToolbar,
            .supplierHistoryFilters {
              grid-template-columns: 1fr;
            }
            .supplierHistoryImproved .supplierHistoryTable {
              overflow-x: auto;
            }
            .supplierHistoryImproved .supplierHistoryTable table {
              min-width: 680px;
            }
            .clientHistoryStats {
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
          }
          @media (max-width: 480px) {
            .supplierHistoryStats,
            .clientHistoryStats {
              grid-template-columns: 1fr;
            }
          }
          '''

          app_path.write_text(app, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          PY

          python /tmp/patch.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/improve-supplier-history-apc-count.yml
          git add src/App.tsx src/index.css
          git commit -m "Separa APCs e melhora histórico de fornecedores"
          git push origin HEAD:codex/ajustar-seletor-pedidos
