name: Fix supplier patch script syntax

on:
  push:
    branches:
      - codex/ajustar-seletor-pedidos

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-fix-supplier-script]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix quoting
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/apply_suppliers_inventory.py')
          text = p.read_text(encoding='utf-8')
          old1 = '''    """    : type === "client"\n      ? existingClient\n        ? "Editar cliente"\n        : "Cadastrar cliente"\n      : type === "product"""",'''
          new1 = '''    \'\'\'    : type === "client"\n      ? existingClient\n        ? "Editar cliente"\n        : "Cadastrar cliente"\n      : type === "product"\'\'\','''
          old2 = '''    """    : type === "client"\n      ? existingClient\n        ? "Editar cliente"\n        : "Cadastrar cliente"\n      : type === "supplier"\n        ? existingSupplier !== undefined\n          ? "Editar fornecedor"\n          : "Cadastrar fornecedor"\n      : type === "product"""",'''
          new2 = '''    \'\'\'    : type === "client"\n      ? existingClient\n        ? "Editar cliente"\n        : "Cadastrar cliente"\n      : type === "supplier"\n        ? existingSupplier !== undefined\n          ? "Editar fornecedor"\n          : "Cadastrar fornecedor"\n      : type === "product"\'\'\','''
          if old1 not in text or old2 not in text:
              raise SystemExit('Expected quoting blocks not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile .github/apply_suppliers_inventory.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/apply_suppliers_inventory.py
          git commit -m "Corrige sintaxe do patch de fornecedores [skip-fix-supplier-script]"
          git push origin HEAD:codex/ajustar-seletor-pedidos
