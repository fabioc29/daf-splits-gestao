name: Apply preparation status adjustment

on:
  push:
    branches:
      - codex/ajustar-seletor-pedidos

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-preparation-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply requested UI and status changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_patch.py
          python /tmp/apply_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/index.css
          git commit -m "Ajusta seletor de situação do pedido [skip-preparation-patch]"
          git push origin HEAD:codex/ajustar-seletor-pedidos
