name: Normalize accumulating font

on:
  push:
    branches:
      - codex/ajustar-seletor-pedidos

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply font adjustment
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/normalize_font.py
          python /tmp/normalize_font.py

      - name: Install dependencies
        run: npm ci

      - name: Validate build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-accumulating-font.yml
          git add src/App.tsx src/index.css
          git commit -m "Iguala fonte de Vai acumular às demais opções"
          git push origin HEAD:codex/ajustar-seletor-pedidos
